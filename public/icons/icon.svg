<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd3ff"/><stop offset="1" stop-color="#d9efff"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2b3a4a" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#sky)"/>
  <circle cx="400" cy="110" r="44" fill="#ffe28a"/>
  <g fill="#fff" opacity="0.9"><ellipse cx="120" cy="140" rx="60" ry="30"/><ellipse cx="160" cy="125" rx="40" ry="26"/></g>
  <!-- cannon -->
  <g transform="translate(150 360) rotate(-35)" filter="url(#sh)">
    <rect x="-60" y="-40" width="220" height="80" rx="30" fill="#c0392b" stroke="#3b3530" stroke-width="10"/>
    <rect x="30" y="-44" width="14" height="88" fill="#f2c14e"/><rect x="90" y="-44" width="14" height="88" fill="#f2c14e"/>
    <circle cx="-60" cy="0" r="46" fill="#c0392b" stroke="#3b3530" stroke-width="10"/>
    <ellipse cx="162" cy="0" rx="18" ry="44" fill="#2f2f33" stroke="#f2c14e" stroke-width="10"/>
  </g>
  <circle cx="150" cy="400" r="46" fill="#f2c14e" stroke="#3b3530" stroke-width="10"/>
  <!-- smoke -->
  <g fill="#fff" opacity="0.85"><circle cx="300" cy="245" r="26"/><circle cx="330" cy="230" r="20"/><circle cx="285" cy="215" r="16"/></g>
  <!-- steve, superman pose -->
  <g transform="translate(360 190) rotate(-35)" filter="url(#sh)">
    <rect x="-40" y="-16" width="80" height="34" rx="14" fill="#d8392b" stroke="#3b3530" stroke-width="8"/>
    <rect x="-90" y="-12" width="54" height="16" rx="8" fill="#f4e3c1" stroke="#3b3530" stroke-width="8"/>
    <rect x="36" y="-10" width="50" height="16" rx="8" fill="#f4e3c1" stroke="#3b3530" stroke-width="8"/>
    <circle cx="112" cy="-4" r="22" fill="#f1c9a5" stroke="#3b3530" stroke-width="8"/>
    <path d="M90 -8 A22 22 0 0 1 134 -8 Z" fill="#f2c14e"/>
    <polygon points="-2,-6 6,-6 0,2 6,2 -4,12 -1,4 -7,4" fill="#f2c14e"/>
  </g>
  <rect x="80" y="440" width="352" height="24" rx="12" fill="#7bc96f"/>
</svg>
